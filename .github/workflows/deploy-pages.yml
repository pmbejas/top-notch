name: Deploy Top-Notch to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar sitio estático Next.js para GitHub Pages (/top-notch)
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/top-notch"
        run: npm run build:pages

      - name: Publicar compilado estático en rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: "./out"

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
